<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1400px; height: 560px; overflow: hidden;
    background: radial-gradient(circle at 10% 0%, #3a1212, #0f0f0f 60%);
    color: #fff; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    padding: 0 72px; display: flex; align-items: center; gap: 56px;
  }
  .text { width: 470px; flex: none; }
  .text img { width: 84px; height: 84px; }
  h1 { margin-top: 28px; font-size: 52px; line-height: 1.08; font-weight: 700; letter-spacing: -0.6px; }
  p { margin-top: 18px; font-size: 22px; color: #ccc; line-height: 1.4; }
  p b { color: #fff; }
  .stage { display: flex; align-items: center; gap: 22px; }
  .label { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: #999; margin-bottom: 10px; }
  .label.ok { color: #4ade80; }
  .frame { position: relative; width: 340px; height: 191px; border-radius: 8px; overflow: hidden; background: #131722; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
  .frame svg.chart { position: absolute; inset: 0; width: 100%; height: 100%; }
  .caption { position: absolute; bottom: 38px; left: 50%; transform: translateX(-50%); background: rgba(8,8,8,.75); padding: 3px 8px; font-size: 12px; white-space: nowrap; }
  .controls { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; padding: 0 10px; display: flex; align-items: center; gap: 10px; background: linear-gradient(transparent, rgba(0,0,0,.8)); }
  .progress { position: absolute; left: 10px; right: 10px; bottom: 30px; height: 3px; background: rgba(255,255,255,.3); }
  .progress::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 42%; background: #f00; }
  .play { width: 0; height: 0; border-left: 11px solid #fff; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
  .spacer { flex: 1; }
  .cam { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,0,0,.25); box-shadow: 0 0 0 2px #f00; }
  .ctl { width: 12px; height: 12px; border-radius: 2px; background: rgba(255,255,255,.85); }
  .arrow { font-size: 40px; color: #f00; margin-top: 24px; }
</style>
</head>
<body>
  <div class="text">
    <img src="../icons/icon128.png" alt="" />
    <h1>Frame Capture<br />for YouTube</h1>
    <p>Grab the exact video frame in one click — <b>no subtitles, no player controls</b>, ready to paste into your notes.</p>
  </div>
  <div class="stage">
    <div>
      <div class="label">What you see</div>
      <div class="frame">
        <svg class="chart" viewBox="0 0 520 292" preserveAspectRatio="none"></svg>
        <div class="caption">so the buyers step in right at this level</div>
        <div class="progress"></div>
        <div class="controls">
          <div class="play"></div><div class="spacer"></div>
          <div class="cam"><svg viewBox="0 0 36 36" width="22" height="22"><path fill="#fff" d="M14.5 10l-1.8 2.5H10a2 2 0 0 0-2 2V24a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-9.5a2 2 0 0 0-2-2h-2.7L21.5 10h-7zM18 15a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg></div>
          <div class="ctl"></div><div class="ctl"></div>
        </div>
      </div>
    </div>
    <div class="arrow">→</div>
    <div>
      <div class="label ok">What you get</div>
      <div class="frame"><svg class="chart" viewBox="0 0 520 292" preserveAspectRatio="none"></svg></div>
    </div>
  </div>
<script>
  // Deterministic candlestick chart so both frames show the identical picture
  let seed = 7;
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const candles = [];
  let price = 0;
  for (let i = 0; i < 40; i++) {
    const open = price, close = open + (rand() - 0.45) * 10;
    candles.push({ open, close, hi: Math.max(open, close) + rand() * 4, lo: Math.min(open, close) - rand() * 4 });
    price = close;
  }
  // Fit the series into the visible area above the subtitle/controls
  const max = Math.max(...candles.map((c) => c.hi)), min = Math.min(...candles.map((c) => c.lo));
  const y = (v) => 30 + ((max - v) / (max - min)) * 170;
  const parts = [];
  candles.forEach((c, i) => {
    const x = 18 + i * 12.4, color = c.close >= c.open ? '#26a69a' : '#ef5350';
    parts.push(`<line x1="${x + 4.5}" x2="${x + 4.5}" y1="${y(c.hi)}" y2="${y(c.lo)}" stroke="${color}" stroke-width="1.4"/>`);
    parts.push(`<rect x="${x}" y="${y(Math.max(c.open, c.close))}" width="9" height="${Math.max(1.5, Math.abs(y(c.open) - y(c.close)))}" fill="${color}"/>`);
  });
  const grid = [58, 116, 174, 232].map((v) => `<line x1="0" x2="520" y1="${v}" y2="${v}" stroke="#2a2e39"/>`).join('');
  document.querySelectorAll('svg.chart').forEach((s) => (s.innerHTML = grid + parts.join('')));
</script>
</body>
</html>
